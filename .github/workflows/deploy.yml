name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      # All three actions below are pinned to versions whose own runtime is
      # node24. The v4 line targeted node20, which GitHub deprecated and was
      # force-running on node24 anyway, with a warning on every deploy.
      # fetch-depth: 0 is load-bearing twice over: showLastUpdateTime reads git
      # for each doc's date, and the IndexNow step diffs HEAD~1..HEAD.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          # Node 24 is the current Active LTS and matches .nvmrc. 23 was an
          # odd-numbered line that went EOL in May 2025, and nothing local or
          # in CI was actually running it.
          node-version: 24
          cache: npm

      - name: Install dependencies
        # npm ci, not npm install: --frozen-lockfile is a pnpm/yarn flag that
        # npm silently ignores, so the lockfile was never actually enforced and
        # a deploy could resolve different versions than a local build. npm ci
        # installs strictly from package-lock.json and fails if the two drift.
        run: npm ci
      - name: Build website
        run: npm run build

      # Popular action to deploy to GitHub Pages:
      # Docs: https://github.com/peaceiris/actions-gh-pages#%EF%B8%8F-docusaurus
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Build output to publish to the `gh-pages` branch:
          publish_dir: ./build
          publish_branch: gh-pages
          # The following lines assign commit authorship to the official
          # GH-Actions bot for deploys to `gh-pages` branch:
          # https://github.com/actions/checkout/issues/13#issuecomment-724415212
          # The GH actions bot is used by default if you didn't specify the two fields.
          # You can swap them out with your own user credentials.
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com

      # Bing's index is the retrieval layer for ChatGPT search and Copilot, so a
      # page it has not crawled cannot be cited by either. IndexNow shortens that
      # from weeks to about a day. Only changed docs are submitted; resubmitting
      # the whole corpus on every push is what gets a key rate-limited.
      #
      # Runs after the deploy so the URLs are live when Bing comes to fetch them,
      # and never fails the job: the pages are already published either way.
      - name: Ping IndexNow with changed docs
        continue-on-error: true
        env:
          # Public by design: IndexNow verifies ownership by fetching this key
          # back from https://selfcustodylabs.com/<key>.txt, so it is not a secret.
          INDEXNOW_KEY: d18fe17c571b4c2ca23cec3da15bc089
        run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "no previous commit to diff against, skipping"
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- docs/)
          if [ -z "$CHANGED" ]; then
            echo "no doc changes in this push, skipping"
            exit 0
          fi
          echo "$CHANGED" | xargs node scripts/indexnow-submit.mjs
