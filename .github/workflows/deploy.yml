name: Deploy

on:
  push:
    branches:
      - main
  # "Run workflow" on the Actions tab: redeploys main without a new commit, for
  # example right after the Cloudflare token and account ID are added.
  workflow_dispatch:

# Read-only: the job only checks out the repository. Write access was needed
# to push the gh-pages branch, which ended with the move to Cloudflare Pages.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      # All actions below are pinned to versions whose own runtime is
      # node24. The v4 line targeted node20, which GitHub deprecated and was
      # force-running on node24 anyway, with a warning on every deploy.
      # fetch-depth: 0 is load-bearing twice over: showLastUpdateTime reads git
      # for each doc's date, and the IndexNow step diffs HEAD~1..HEAD.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          # Node 24 is the current Active LTS and matches .nvmrc. 23 was an
          # odd-numbered line that went EOL in May 2025, and nothing local or
          # in CI was actually running it.
          node-version: 24
          cache: npm

      - name: Install dependencies
        # npm ci, not npm install: --frozen-lockfile is a pnpm/yarn flag that
        # npm silently ignores, so the lockfile was never actually enforced and
        # a deploy could resolve different versions than a local build. npm ci
        # installs strictly from package-lock.json and fails if the two drift.
        run: npm ci
      # The rules in CLAUDE.md that a build alone does not enforce: frontmatter
      # limits, no em dashes, OG card parity, no hydration-breaking <p> wrappers.
      - name: Check content
        run: npm run lint && npm run check
      - name: Build website
        run: npm run build
      # Title, description, canonical, robots and JSON-LD of every page, plus the
      # sitemap URL set, against the committed baseline. An intended change is
      # accepted with `npm run seo:accept` and committed with the change itself.
      - name: Check SEO snapshot
        run: npm run seo:check

      # Cloudflare Pages serves the site. The build already contains _redirects
      # (real 301s) and _headers (CSP, HSTS, caching), both written by
      # plugins/cloudflare.
      #
      # CLOUDFLARE_ACCOUNT_ID is a repository *variable* (not a secret: an
      # account ID grants nothing). The API token is a secret handed to this
      # step only; putting it in job-level env would expose it to every npm
      # install script above. If either is missing the step fails, which is
      # the point: this is the only deploy.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=selfcustodylabs --branch=main

      # Bing's index is the retrieval layer for ChatGPT search and Copilot, so a
      # page it has not crawled cannot be cited by either. IndexNow shortens that
      # from weeks to about a day. Only changed docs are submitted; resubmitting
      # the whole corpus on every push is what gets a key rate-limited.
      #
      # Runs after the deploy so the URLs are live when Bing comes to fetch them,
      # and never fails the job: the pages are already published either way.
      - name: Ping IndexNow with changed docs
        # A manual run redeploys what is already live and indexed.
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        env:
          # Public by design: IndexNow verifies ownership by fetching this key
          # back from https://selfcustodylabs.com/<key>.txt, so it is not a secret.
          INDEXNOW_KEY: d18fe17c571b4c2ca23cec3da15bc089
        run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "no previous commit to diff against, skipping"
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- docs/ notes/)
          if [ -z "$CHANGED" ]; then
            echo "no doc or note changes in this push, skipping"
            exit 0
          fi
          echo "$CHANGED" | xargs node scripts/indexnow-submit.mjs
