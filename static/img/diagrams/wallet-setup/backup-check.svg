<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="Backup verification: restore the written seed on a second device and compare first addresses; identical addresses prove the paper backup restores the wallet, any difference means stop and find the error before funding.">
  <style>
    .mono { font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; fill: #767C8A; }
    .head    { font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .amt     { font-size: 12px; font-weight: 500; fill: #A8AEBB; }
    .amt-lit { font-size: 12px; font-weight: 700; fill: #FCD34D; }
    .cap     { font-size: 10px; font-weight: 700; letter-spacing: 1.6px; }
    .tag     { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #767C8A; }
    .tag-a   { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #F59E0B; }
    .tag-e   { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #C66A20; }
    .note    { font-size: 11px; letter-spacing: 1.4px; fill: #767C8A; }
    .wire    { fill: none; stroke: #262E3A; stroke-width: 2; }
    .flow    { fill: none; stroke: #F59E0B; stroke-width: 3; }
    .embr    { fill: none; stroke: #C66A20; stroke-width: 3; }
    .dashd   { fill: none; stroke: #2E3643; stroke-width: 2; stroke-dasharray: 6 5; }
    .dashe   { fill: none; stroke: #C66A20; stroke-width: 2; stroke-dasharray: 6 5; }
    .box     { fill: #0C0E12; stroke: #2E3643; stroke-width: 2; }
    .box-lit { fill: #0C0E12; stroke: #F59E0B; stroke-width: 3; }
    .box-e   { fill: #0C0E12; stroke: #C66A20; stroke-width: 3; }
    .panel   { fill: none; stroke: #2E3643; stroke-width: 2; }
    .panel-e { fill: none; stroke: #C66A20; stroke-width: 2; }
  </style>
  <rect x="0.5" y="0.5" width="799" height="349" rx="14" fill="#0C0E12" stroke="#1C2028"/>
  <text class="mono eyebrow" x="40" y="42">PROVE THE BACKUP BEFORE YOU NEED IT</text>
  <rect class="box" x="40" y="100" width="320" height="84" rx="6"/>
  <text class="mono amt" x="200" y="128" text-anchor="middle">ORIGINAL WALLET</text>
  <text class="mono tag" x="200" y="150" text-anchor="middle">FIRST ADDRESS:</text>
  <text class="mono tag-a" x="200" y="168" text-anchor="middle">BC1QXY2...ABC</text>
  <rect class="box" x="440" y="100" width="320" height="84" rx="6"/>
  <text class="mono amt" x="600" y="128" text-anchor="middle">RESTORED FROM PAPER</text>
  <text class="mono tag" x="600" y="150" text-anchor="middle">FIRST ADDRESS:</text>
  <text class="mono tag-a" x="600" y="168" text-anchor="middle">BC1QXY2...ABC</text>
  <text class="mono amt-lit" x="400" y="146" text-anchor="middle">=</text>
  <text class="mono cap" x="40" y="240" fill="#F59E0B">IDENTICAL ADDRESSES: THE WORDS ON PAPER REALLY DO RESTORE YOUR WALLET</text>
  <text class="mono cap" x="40" y="262" fill="#C66A20">ANY DIFFERENCE: STOP &#183; DO NOT FUND &#183; FIND THE ERROR FIRST</text>
  <text class="mono note" x="40" y="320">WIPE THE TEST RESTORE WHEN DONE &#183; A BACKUP IS ONLY REAL ONCE IT HAS BEEN TESTED</text>
</svg>
