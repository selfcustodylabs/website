<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 406" width="800" height="406" role="img" aria-label="The air gap: a watch-only wallet on the online computer exchanges only PSBTs with the air-gapped signer via QR codes or SD cards; the seed and private keys never cross, and neither does any cable, wifi or bluetooth.">
  <style>
    .mono { font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; fill: #767C8A; }
    .head    { font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .amt     { font-size: 12px; font-weight: 500; fill: #A8AEBB; }
    .amt-lit { font-size: 12px; font-weight: 700; fill: #FCD34D; }
    .cap     { font-size: 10px; font-weight: 700; letter-spacing: 1.6px; }
    .tag     { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #767C8A; }
    .tag-a   { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #F59E0B; }
    .tag-e   { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #C66A20; }
    .note    { font-size: 11px; letter-spacing: 1.4px; fill: #767C8A; }
    .wire    { fill: none; stroke: #262E3A; stroke-width: 2; }
    .flow    { fill: none; stroke: #F59E0B; stroke-width: 3; }
    .embr    { fill: none; stroke: #C66A20; stroke-width: 3; }
    .dashd   { fill: none; stroke: #2E3643; stroke-width: 2; stroke-dasharray: 6 5; }
    .dashe   { fill: none; stroke: #C66A20; stroke-width: 2; stroke-dasharray: 6 5; }
    .box     { fill: #0C0E12; stroke: #2E3643; stroke-width: 2; }
    .box-lit { fill: #0C0E12; stroke: #F59E0B; stroke-width: 3; }
    .box-e   { fill: #0C0E12; stroke: #C66A20; stroke-width: 3; }
    .panel   { fill: none; stroke: #2E3643; stroke-width: 2; }
    .panel-e { fill: none; stroke: #C66A20; stroke-width: 2; }
  </style>
  <rect x="0.5" y="0.5" width="799" height="405" rx="14" fill="#0C0E12" stroke="#1C2028"/>
  <text class="mono eyebrow" x="40" y="42">THE AIR GAP &#183; WHAT CROSSES, WHAT NEVER DOES</text>
  <rect class="dashd" x="40" y="80" width="280" height="180" rx="10" fill="none"/>
  <text class="mono head" x="56" y="106" fill="#767C8A">ONLINE COMPUTER</text>
  <rect class="box" x="60" y="126" width="240" height="40" rx="6"/>
  <text class="mono amt" x="180" y="151" text-anchor="middle">WATCH-ONLY WALLET</text>
  <rect class="dashe" x="480" y="80" width="280" height="180" rx="10" fill="none"/>
  <text class="mono head" x="496" y="106" fill="#F59E0B">AIR-GAPPED SIGNER</text>
  <rect class="box-lit" x="500" y="126" width="240" height="40" rx="6"/>
  <text class="mono amt-lit" x="620" y="151" text-anchor="middle">SEED + PRIVATE KEYS</text>
  <path class="wire" d="M324,150 L476,150"/>
  <path d="M476,150 L469,145.9 M476,150 L469,154.1" stroke="#262E3A" stroke-width="2" fill="none"/>
  <path class="wire" d="M480,216 L334,216"/>
  <path d="M334,216 L341,211.9 M334,216 L341,220.1" stroke="#262E3A" stroke-width="2" fill="none"/>
  <text class="mono tag" x="400" y="140" text-anchor="middle">PSBT OUT &#183; QR OR SD</text>
  <text class="mono tag" x="400" y="206" text-anchor="middle">PSBT BACK &#183; SIGNED</text>
  <text class="mono cap" x="40" y="306" fill="#F59E0B">CROSSES THE GAP: THE PSBT, NOTHING ELSE</text>
  <text class="mono cap" x="40" y="326" fill="#C66A20">NEVER CROSSES: SEED, KEYS, ANY CABLE TO THE INTERNET</text>
  <text class="mono note" x="40" y="376">NO USB TO AN ONLINE MACHINE, NO WIFI, NO BLUETOOTH &#183; QR CODES AND SD CARDS ONLY</text>
</svg>
