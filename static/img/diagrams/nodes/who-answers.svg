<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="A wallet's queries can go to a random public node, whose unknown operator logs the addresses and builds a profile, or to your own node, where the queries never leave your home.">
  <style>
    .mono { font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; fill: #767C8A; }
    .head    { font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .amt     { font-size: 12px; font-weight: 500; fill: #A8AEBB; }
    .amt-lit { font-size: 12px; font-weight: 700; fill: #FCD34D; }
    .cap     { font-size: 10px; font-weight: 700; letter-spacing: 1.6px; }
    .tag     { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #767C8A; }
    .tag-a   { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #F59E0B; }
    .tag-e   { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #C66A20; }
    .note    { font-size: 11px; letter-spacing: 1.4px; fill: #767C8A; }
    .wire    { fill: none; stroke: #262E3A; stroke-width: 2; }
    .flow    { fill: none; stroke: #F59E0B; stroke-width: 3; }
    .embr    { fill: none; stroke: #C66A20; stroke-width: 3; }
    .dashd   { fill: none; stroke: #2E3643; stroke-width: 2; stroke-dasharray: 6 5; }
    .dashe   { fill: none; stroke: #C66A20; stroke-width: 2; stroke-dasharray: 6 5; }
    .box     { fill: #0C0E12; stroke: #2E3643; stroke-width: 2; }
    .box-lit { fill: #0C0E12; stroke: #F59E0B; stroke-width: 3; }
    .box-e   { fill: #0C0E12; stroke: #C66A20; stroke-width: 3; }
    .panel   { fill: none; stroke: #2E3643; stroke-width: 2; }
    .panel-e { fill: none; stroke: #C66A20; stroke-width: 2; }
  </style>
  <rect x="0.5" y="0.5" width="799" height="419" rx="14" fill="#0C0E12" stroke="#1C2028"/>
  <text class="mono eyebrow" x="40" y="42">WHO ANSWERS YOUR WALLET?</text>
  <rect class="box" x="40" y="180" width="150" height="48" rx="6"/>
  <text class="mono amt" x="115" y="202" text-anchor="middle">YOUR WALLET</text>
  <text class="mono tag" x="115" y="219" text-anchor="middle">ASKS ITS QUESTIONS</text>
  <path class="embr" d="M190,190 C295,190 295,120 400,120"/>
  <rect class="box-e" x="400" y="96" width="240" height="52" rx="6"/>
  <text class="mono amt" x="520" y="118" text-anchor="middle">RANDOM PUBLIC NODE</text>
  <text class="mono tag" x="520" y="136" text-anchor="middle">UNKNOWN OPERATOR</text>
  <text class="mono tag-e" x="656" y="118">LOGS YOUR ADDRESSES,</text>
  <text class="mono tag-e" x="656" y="132">BUILDS A PROFILE</text>
  <path class="flow" d="M190,218 C295,218 295,290 400,290"/>
  <rect class="box-lit" x="400" y="266" width="240" height="52" rx="6"/>
  <text class="mono amt-lit" x="520" y="288" text-anchor="middle">YOUR OWN NODE</text>
  <text class="mono tag" x="520" y="306" text-anchor="middle">YOUR HARDWARE, YOUR RULES</text>
  <text class="mono tag-a" x="656" y="288">QUERIES NEVER</text>
  <text class="mono tag-a" x="656" y="302">LEAVE YOUR HOME</text>
  <text class="mono note" x="40" y="384">SAME ANSWERS EITHER WAY &#183; ONLY ONE PATH KEEPS THE QUESTIONS PRIVATE</text>
</svg>
