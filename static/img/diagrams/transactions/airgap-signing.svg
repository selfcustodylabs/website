<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="Air-gapped signing: an online watch-only wallet builds the transaction and exports a PSBT, the file crosses the gap by USB, QR or SD card, an offline device holding the private key signs it, and the signed PSBT returns to the online side for broadcast; the key never crosses.">
  <style>
    .mono { font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; fill: #767C8A; }
    .zone    { font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .stepn   { font-size: 11px; font-weight: 700; fill: #F59E0B; }
    .amt     { font-size: 11px; font-weight: 500; fill: #A8AEBB; }
    .key     { font-size: 11px; font-weight: 700; fill: #FCD34D; }
    .tag     { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #767C8A; }
    .note    { font-size: 11px; letter-spacing: 1.4px; fill: #767C8A; }
    .zoneb   { fill: none; stroke: #2E3643; stroke-width: 2; stroke-dasharray: 6 5; }
    .zonek   { fill: none; stroke: #F59E0B; stroke-width: 2; stroke-dasharray: 6 5; }
    .box     { fill: #0C0E12; stroke: #2E3643; stroke-width: 2; }
    .keybox  { fill: #0C0E12; stroke: #F59E0B; stroke-width: 3; }
    .cross   { fill: none; stroke: #A8AEBB; stroke-width: 2; }
  </style>

  <rect x="0.5" y="0.5" width="799" height="469" rx="14" fill="#0C0E12" stroke="#1C2028"/>
  <text class="mono eyebrow" x="40" y="42">AIR-GAPPED SIGNING &#183; ONLY THE PSBT CROSSES</text>

  <rect class="zoneb" x="40" y="76" width="290" height="300" rx="10"/>
  <text class="mono zone" x="56" y="104" fill="#767C8A">ONLINE &#183; WATCH-ONLY</text>
  <rect class="zonek" x="470" y="76" width="290" height="300" rx="10"/>
  <text class="mono zone" x="486" y="104" fill="#F59E0B">OFFLINE &#183; AIR-GAPPED</text>

  <rect class="box" x="60" y="128" width="250" height="40" rx="6"/>
  <text class="mono stepn" x="76" y="153">1</text>
  <text class="mono amt" x="92" y="153">BUILD TX &#183; EXPORT PSBT</text>

  <rect class="box" x="60" y="300" width="250" height="40" rx="6"/>
  <text class="mono stepn" x="76" y="325">4</text>
  <text class="mono amt" x="92" y="325">BROADCAST SIGNED TX</text>

  <rect class="box" x="490" y="128" width="250" height="40" rx="6"/>
  <text class="mono stepn" x="506" y="153">2</text>
  <text class="mono amt" x="522" y="153">SIGN WITH PRIVATE KEY</text>

  <rect class="keybox" x="490" y="300" width="250" height="40" rx="6"/>
  <text class="mono key" x="615" y="325" text-anchor="middle">PRIVATE KEY &#183; NEVER LEAVES</text>

  <!-- the gap -->
  <path class="cross" d="M330,148 L462,148"/>
  <path class="cross" d="M462,148 L455,143.9 M462,148 L455,152.1"/>
  <path class="cross" d="M470,236 L338,236"/>
  <path class="cross" d="M338,236 L345,231.9 M338,236 L345,240.1"/>
  <text class="mono tag" x="400" y="136" text-anchor="middle">PSBT, UNSIGNED</text>
  <text class="mono tag" x="400" y="226" text-anchor="middle">3 &#183; PSBT, SIGNED</text>
  <text class="mono tag" x="400" y="266" text-anchor="middle">USB &#183; QR &#183; SD CARD</text>

  <text class="mono note" x="40" y="412">THE MACHINE THAT TOUCHES THE INTERNET NEVER SEES THE KEY.</text>
  <text class="mono note" x="40" y="432">THE MACHINE THAT HOLDS THE KEY NEVER TOUCHES THE INTERNET.</text>
</svg>
