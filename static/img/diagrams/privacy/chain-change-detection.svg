<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" aria-label="Change detection: a 1.00 BTC input pays 0.70 BTC to a round-number payment output and 0.29 BTC to a new address of the same script type; the odd remainder marks it as change returning to the sender, with 0.01 BTC as fee.">
  <style>
    .mono { font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; fill: #767C8A; }
    .head    { font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .amt     { font-size: 12px; font-weight: 500; fill: #A8AEBB; }
    .amt-lit { font-size: 12px; font-weight: 700; fill: #FCD34D; }
    .cap     { font-size: 10px; font-weight: 700; letter-spacing: 1.6px; }
    .tag     { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #767C8A; }
    .tag-a   { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #F59E0B; }
    .tag-e   { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #C66A20; }
    .note    { font-size: 11px; letter-spacing: 1.4px; fill: #767C8A; }
    .wire    { fill: none; stroke: #262E3A; stroke-width: 2; }
    .flow    { fill: none; stroke: #F59E0B; stroke-width: 3; }
    .embr    { fill: none; stroke: #C66A20; stroke-width: 3; }
    .dashd   { fill: none; stroke: #2E3643; stroke-width: 2; stroke-dasharray: 6 5; }
    .dashe   { fill: none; stroke: #C66A20; stroke-width: 2; stroke-dasharray: 6 5; }
    .box     { fill: #0C0E12; stroke: #2E3643; stroke-width: 2; }
    .box-lit { fill: #0C0E12; stroke: #F59E0B; stroke-width: 3; }
    .box-e   { fill: #0C0E12; stroke: #C66A20; stroke-width: 3; }
    .panel   { fill: none; stroke: #2E3643; stroke-width: 2; }
    .panel-e { fill: none; stroke: #C66A20; stroke-width: 2; }
  </style>
  <rect x="0.5" y="0.5" width="799" height="389" rx="14" fill="#0C0E12" stroke="#1C2028"/>
  <text class="mono eyebrow" x="40" y="42">HEURISTIC 2 &#183; WHICH OUTPUT IS THE CHANGE?</text>
  <rect class="box" x="60" y="150" width="150" height="40" rx="6"/>
  <text class="mono amt" x="135" y="175" text-anchor="middle">A &#183; 1.00</text>
  <path class="wire" d="M210,170 C340,170 340,120 470,120"/>
  <path class="embr" d="M210,170 C340,170 340,230 470,230"/>
  <rect class="box" x="470" y="102" width="130" height="36" rx="6"/>
  <text class="mono amt" x="535" y="125" text-anchor="middle">B &#183; 0.70</text>
  <text class="mono tag" x="614" y="118">PAYMENT &#183; ROUND NUMBER</text>
  <rect class="box-e" x="470" y="212" width="130" height="36" rx="6"/>
  <text class="mono amt" x="535" y="235" text-anchor="middle">C &#183; 0.29</text>
  <text class="mono tag-e" x="614" y="222">NEW ADDRESS</text>
  <text class="mono tag-e" x="614" y="236">ODD AMOUNT</text>
  <text class="mono tag-e" x="614" y="250">SAME TYPE AS INPUT</text>
  <text class="mono cap" x="60" y="300" fill="#C66A20">THREE CLUES POINT AT C &#183; THE CHANGE GOES BACK TO THE SENDER</text>
  <text class="mono note" x="40" y="360">1.00 = 0.70 + 0.29 + 0.01 FEE &#183; ONCE C IS TAGGED AS YOURS, ITS FUTURE IS TOO</text>
</svg>
