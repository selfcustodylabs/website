<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-label="Consolidating 0.01, 0.02 and 0.03 BTC that all came from Coinbase into 0.06 BTC reveals nothing new; consolidating the same amounts from Coinbase, Kraken and a non-KYC trade fuses three separate histories forever.">
  <style>
    .mono { font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; fill: #767C8A; }
    .title-g { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #F59E0B; }
    .title-b { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #C66A20; }
    .amt     { font-size: 12px; font-weight: 500; fill: #A8AEBB; }
    .cap     { font-size: 10px; font-weight: 700; letter-spacing: 1.6px; }
    .note    { font-size: 11px; letter-spacing: 1.4px; fill: #767C8A; }
    .goodp   { fill: none; stroke: #2E3643; stroke-width: 2; }
    .badp    { fill: none; stroke: #C66A20; stroke-width: 2; }
    .flow    { fill: none; stroke: #F59E0B; stroke-width: 3; }
    .merge   { fill: none; stroke: #C66A20; stroke-width: 3; }
    .same    { fill: #0C0E12; stroke: #2E3643; stroke-width: 2; }
    .out-g   { fill: #0C0E12; stroke: #F59E0B; stroke-width: 3; }
    .out-b   { fill: #0C0E12; stroke: #C66A20; stroke-width: 3; }
  </style>

  <rect x="0.5" y="0.5" width="799" height="539" rx="14" fill="#0C0E12" stroke="#1C2028"/>
  <text class="mono eyebrow" x="40" y="42">THE CONSOLIDATION RULE &#183; SOURCES DECIDE</text>

  <!-- GOOD: one source -->
  <rect class="goodp" x="40" y="66" width="720" height="196" rx="10"/>
  <text class="mono title-g" x="56" y="94">SAME SOURCE &#183; SAFE TO CONSOLIDATE</text>

  <path class="flow" d="M276,128 C388,128 388,158 500,158"/>
  <path class="flow" d="M276,168 C388,168 388,168 500,168"/>
  <path class="flow" d="M276,208 C388,208 388,178 500,178"/>

  <rect class="same" x="80" y="112" width="196" height="28" rx="6"/>
  <text class="mono amt" x="178" y="131" text-anchor="middle">0.01 &#183; COINBASE</text>
  <rect class="same" x="80" y="152" width="196" height="28" rx="6"/>
  <text class="mono amt" x="178" y="171" text-anchor="middle">0.02 &#183; COINBASE</text>
  <rect class="same" x="80" y="192" width="196" height="28" rx="6"/>
  <text class="mono amt" x="178" y="211" text-anchor="middle">0.03 &#183; COINBASE</text>

  <rect class="out-g" x="500" y="148" width="190" height="40" rx="8"/>
  <text class="mono amt" x="595" y="173" text-anchor="middle">0.06 &#183; TO YOURSELF</text>

  <text class="mono cap" x="80" y="240" fill="#F59E0B">ALREADY LINKED TO ONE IDENTITY &#183; NOTHING NEW REVEALED</text>

  <!-- BAD: three sources -->
  <rect class="badp" x="40" y="286" width="720" height="196" rx="10"/>
  <text class="mono title-b" x="56" y="314">MIXED SOURCES &#183; NEVER DO THIS</text>

  <path class="merge" d="M276,348 C388,348 388,378 500,378"/>
  <path class="merge" d="M276,388 C388,388 388,388 500,388"/>
  <path class="merge" d="M276,428 C388,428 388,398 500,398"/>

  <rect class="same" x="80" y="332" width="196" height="28" rx="6"/>
  <text class="mono amt" x="178" y="351" text-anchor="middle">0.01 &#183; COINBASE</text>
  <rect class="same" x="80" y="372" width="196" height="28" rx="6"/>
  <text class="mono amt" x="178" y="391" text-anchor="middle">0.02 &#183; KRAKEN</text>
  <rect class="same" x="80" y="412" width="196" height="28" rx="6"/>
  <text class="mono amt" x="178" y="431" text-anchor="middle">0.03 &#183; NON-KYC</text>

  <rect class="out-b" x="500" y="368" width="190" height="40" rx="8"/>
  <text class="mono amt" x="595" y="393" text-anchor="middle">0.06 &#183; TO YOURSELF</text>

  <text class="mono cap" x="80" y="460" fill="#C66A20">THREE SEPARATE HISTORIES FUSED FOREVER</text>

  <text class="mono note" x="40" y="518">0.01 + 0.02 + 0.03 = 0.06 IN BOTH &#183; FEES OMITTED &#183; ONLY THE SOURCES DIFFER</text>
</svg>
