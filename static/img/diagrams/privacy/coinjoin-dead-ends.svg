<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Alice's employer, Bob's exchange and anyone watching Carol each follow a 0.1 BTC coin into the same CoinJoin and out to three identical 0.1 BTC outputs; every watcher's trail dead-ends into a one-in-three guess.">
  <style>
    .mono { font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; fill: #767C8A; }
    .head    { font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .amt     { font-size: 12px; font-weight: 500; fill: #A8AEBB; }
    .amt-lit { font-size: 12px; font-weight: 700; fill: #FCD34D; }
    .cap     { font-size: 10px; font-weight: 700; letter-spacing: 1.6px; }
    .tag     { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #767C8A; }
    .tag-a   { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #F59E0B; }
    .tag-e   { font-size: 9px; font-weight: 700; letter-spacing: 1.4px; fill: #C66A20; }
    .note    { font-size: 11px; letter-spacing: 1.4px; fill: #767C8A; }
    .wire    { fill: none; stroke: #262E3A; stroke-width: 2; }
    .flow    { fill: none; stroke: #F59E0B; stroke-width: 3; }
    .embr    { fill: none; stroke: #C66A20; stroke-width: 3; }
    .dashd   { fill: none; stroke: #2E3643; stroke-width: 2; stroke-dasharray: 6 5; }
    .dashe   { fill: none; stroke: #C66A20; stroke-width: 2; stroke-dasharray: 6 5; }
    .box     { fill: #0C0E12; stroke: #2E3643; stroke-width: 2; }
    .box-lit { fill: #0C0E12; stroke: #F59E0B; stroke-width: 3; }
    .box-e   { fill: #0C0E12; stroke: #C66A20; stroke-width: 3; }
    .panel   { fill: none; stroke: #2E3643; stroke-width: 2; }
    .panel-e { fill: none; stroke: #C66A20; stroke-width: 2; }
  </style>
  <rect x="0.5" y="0.5" width="799" height="419" rx="14" fill="#0C0E12" stroke="#1C2028"/>
  <text class="mono eyebrow" x="40" y="42">THREE WATCHERS &#183; ONE DEAD END</text>
  <rect class="box" x="40" y="100" width="230" height="40" rx="6"/>
  <text class="mono tag" x="155" y="125" text-anchor="middle">EMPLOYER WATCHES ALICE</text>
  <path class="dashe" d="M270,120 C325,120 325,180 380,180"/>
  <rect class="box" x="40" y="180" width="230" height="40" rx="6"/>
  <text class="mono tag" x="155" y="205" text-anchor="middle">EXCHANGE WATCHES BOB</text>
  <path class="dashe" d="M270,200 C325,200 325,180 380,180"/>
  <rect class="box" x="40" y="260" width="230" height="40" rx="6"/>
  <text class="mono tag" x="155" y="285" text-anchor="middle">ANYONE WATCHES CAROL</text>
  <path class="dashe" d="M270,280 C325,280 325,180 380,180"/>
  <rect class="box-lit" x="380" y="130" width="150" height="110" rx="6"/>
  <text class="mono amt-lit" x="455" y="178" text-anchor="middle">COINJOIN</text>
  <text class="mono tag" x="455" y="198" text-anchor="middle">3 &#215; 0.1 IN</text>
  <path class="wire" d="M530,185 C575,185 575,120 620,120"/>
  <rect class="box" x="620" y="102" width="120" height="36" rx="6"/>
  <text class="mono amt" x="680" y="125" text-anchor="middle">0.1 &#183; ?</text>
  <path class="wire" d="M530,185 C575,185 575,180 620,180"/>
  <rect class="box" x="620" y="162" width="120" height="36" rx="6"/>
  <text class="mono amt" x="680" y="185" text-anchor="middle">0.1 &#183; ?</text>
  <path class="wire" d="M530,185 C575,185 575,240 620,240"/>
  <rect class="box" x="620" y="222" width="120" height="36" rx="6"/>
  <text class="mono amt" x="680" y="245" text-anchor="middle">0.1 &#183; ?</text>
  <text class="mono cap" x="40" y="336" fill="#F59E0B">EVERY TRAIL ENDS AT THE MIX &#183; EACH WATCHER FACES THE SAME ANSWER: ONE OF THREE</text>
  <text class="mono note" x="40" y="386">0.3 IN = 3 &#215; 0.1 OUT &#183; FEES OMITTED &#183; BIGGER ROUNDS AND REMIXES STRETCH THE ODDS FURTHER</text>
</svg>
