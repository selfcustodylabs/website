<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Five unequal inputs each produce one identical 0.20 BTC mixed output plus their own change; the mixed outputs cannot be told apart, but change stays linkable by amount.">
  <style>
    .mono { font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; fill: #767C8A; }
    .head    { font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .amt     { font-size: 13px; font-weight: 500; fill: #A8AEBB; }
    .amt-lit { font-size: 13px; font-weight: 700; fill: #FCD34D; }
    .small   { font-size: 11px; font-weight: 500; fill: #A8AEBB; }
    .lbl     { font-size: 10px; font-weight: 700; letter-spacing: 1.4px; fill: #767C8A; }
    .note    { font-size: 11px; letter-spacing: 1.4px; fill: #767C8A; }
    .wire    { fill: none; stroke: #262E3A; stroke-width: 2; }
    .wire-lit{ fill: none; stroke: #F59E0B; stroke-width: 3; }
    .dash    { fill: none; stroke: #2E3643; stroke-width: 2; stroke-dasharray: 6 5; }
    .box     { fill: #0C0E12; stroke: #2E3643; stroke-width: 2; }
    .box-lit { fill: #0C0E12; stroke: #F59E0B; stroke-width: 3; }
  </style>

  <rect x="0.5" y="0.5" width="799" height="519" rx="14" fill="#0C0E12" stroke="#1C2028"/>
  <text class="mono eyebrow" x="40" y="42">COINJOIN TRANSACTION</text>

  <text class="mono head" x="250" y="76" text-anchor="end" fill="#767C8A">UNEQUAL INPUTS</text>
  <text class="mono head" x="560" y="76" fill="#F59E0B">EQUAL OUTPUTS &#183; 0.20 EACH</text>

  <!-- mix wires: drawn first so the boxes sit on top -->
  <path class="wire" d="M250,118 C405,118 405,230 560,230"/>
  <path class="wire" d="M250,174 C405,174 405,342 560,342"/>
  <path class="wire" d="M250,286 C405,286 405,286 560,286"/>
  <path class="wire" d="M250,342 C405,342 405,174 560,174"/>
  <path class="wire-lit" d="M250,230 C405,230 405,118 560,118"/>

  <!-- inputs: width encodes amount, all right-aligned to a common rail -->
  <rect class="box"     x="154" y="102" width="96" height="32" rx="6"/>
  <text class="mono amt" x="240" y="123" text-anchor="end">0.82</text>
  <rect class="box"     x="192" y="158" width="58" height="32" rx="6"/>
  <text class="mono amt" x="240" y="179" text-anchor="end">0.31</text>
  <rect class="box-lit" x="172" y="214" width="78" height="32" rx="6"/>
  <text class="mono amt-lit" x="240" y="235" text-anchor="end">0.55</text>
  <rect class="box"     x="198" y="270" width="52" height="32" rx="6"/>
  <text class="mono amt" x="240" y="291" text-anchor="end">0.24</text>
  <rect class="box"     x="182" y="326" width="68" height="32" rx="6"/>
  <text class="mono amt" x="240" y="347" text-anchor="end">0.47</text>

  <!-- mixed outputs: identical geometry, identical value -->
  <rect class="box-lit" x="560" y="102" width="66" height="32" rx="6"/>
  <text class="mono amt-lit" x="570" y="123">0.20</text>
  <rect class="box"     x="560" y="158" width="66" height="32" rx="6"/>
  <text class="mono amt" x="570" y="179">0.20</text>
  <rect class="box"     x="560" y="214" width="66" height="32" rx="6"/>
  <text class="mono amt" x="570" y="235">0.20</text>
  <rect class="box"     x="560" y="270" width="66" height="32" rx="6"/>
  <text class="mono amt" x="570" y="291">0.20</text>
  <rect class="box"     x="560" y="326" width="66" height="32" rx="6"/>
  <text class="mono amt" x="570" y="347">0.20</text>

  <!-- the remainder of every input comes back as its owner's change -->
  <path class="dash" d="M330,378 C400,400 440,408 495,418"/>
  <path d="M495,418 L487.3,420 M495,418 L489.6,412.1" stroke="#2E3643" stroke-width="2" fill="none"/>

  <rect class="dash" x="500" y="390" width="280" height="76" rx="8" fill="none"/>
  <text class="mono lbl" x="512" y="412">CHANGE OUTPUTS &#183; LINKABLE BY AMOUNT</text>
  <rect class="box" x="512" y="424" width="46" height="26" rx="5"/>
  <text class="mono small" x="535" y="441" text-anchor="middle">0.62</text>
  <rect class="box" x="564" y="424" width="46" height="26" rx="5"/>
  <text class="mono small" x="587" y="441" text-anchor="middle">0.11</text>
  <rect class="box" x="616" y="424" width="46" height="26" rx="5"/>
  <text class="mono small" x="639" y="441" text-anchor="middle">0.35</text>
  <rect class="box" x="668" y="424" width="46" height="26" rx="5"/>
  <text class="mono small" x="691" y="441" text-anchor="middle">0.04</text>
  <rect class="box" x="720" y="424" width="46" height="26" rx="5"/>
  <text class="mono small" x="743" y="441" text-anchor="middle">0.27</text>

  <text class="mono note" x="40" y="490">2.39 IN = 5 &#215; 0.20 MIXED + 1.39 CHANGE &#183; MINING FEE OMITTED</text>
  <text class="mono note" x="40" y="508">NEVER MERGE CHANGE WITH YOUR MIXED COINS</text>
</svg>
