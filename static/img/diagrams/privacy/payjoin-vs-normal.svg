<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="In a normal payment Alice's 1.0 BTC input pays Bob 0.7 with 0.3 change; in a PayJoin Bob adds his own 0.5 BTC input and receives 1.2, so the analyst reads the payment as 1.2 and wrongly assumes every input is Alice's.">
  <style>
    .mono { font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; fill: #767C8A; }
    .head    { font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .amt     { font-size: 11px; font-weight: 500; fill: #A8AEBB; }
    .amt-lit { font-size: 11px; font-weight: 700; fill: #FCD34D; }
    .cap     { font-size: 10px; font-weight: 700; letter-spacing: 1.4px; }
    .note    { font-size: 11px; letter-spacing: 1.4px; fill: #767C8A; }
    .wire    { fill: none; stroke: #262E3A; stroke-width: 2; }
    .wire-b  { fill: none; stroke: #F59E0B; stroke-width: 3; }
    .box     { fill: #0C0E12; stroke: #2E3643; stroke-width: 2; }
    .box-b   { fill: #0C0E12; stroke: #F59E0B; stroke-width: 3; }
  </style>

  <rect x="0.5" y="0.5" width="799" height="469" rx="14" fill="#0C0E12" stroke="#1C2028"/>
  <text class="mono eyebrow" x="40" y="42">ALICE PAYS BOB 0.70 &#183; TWO WAYS</text>

  <text class="mono head" x="40" y="82" fill="#767C8A">NORMAL PAYMENT</text>
  <text class="mono head" x="420" y="82" fill="#F59E0B">PAYJOIN (BIP78)</text>

  <line x1="395" y1="100" x2="395" y2="360" stroke="#1C2028" stroke-width="1"/>

  <!-- LEFT: normal -->
  <path class="wire" d="M196,168 C258,168 258,134 320,134"/>
  <path class="wire" d="M196,168 C258,168 258,202 320,202"/>
  <rect class="box" x="56" y="152" width="140" height="32" rx="6"/>
  <text class="mono amt" x="126" y="173" text-anchor="middle">1.00 &#183; ALICE</text>
  <rect class="box" x="320" y="118" width="52" height="32" rx="6"/>
  <text class="mono amt" x="346" y="139" text-anchor="middle">0.70</text>
  <text class="mono cap" x="346" y="108" text-anchor="middle" fill="#767C8A">TO BOB</text>
  <rect class="box" x="320" y="186" width="52" height="32" rx="6"/>
  <text class="mono amt" x="346" y="207" text-anchor="middle">0.30</text>
  <text class="mono cap" x="346" y="240" text-anchor="middle" fill="#767C8A">CHANGE</text>

  <text class="mono cap" x="40" y="300" fill="#767C8A">ANALYST: PAYMENT 0.70, ALL</text>
  <text class="mono cap" x="40" y="318" fill="#767C8A">INPUTS BELONG TO THE SENDER</text>
  <text class="mono cap" x="40" y="348" fill="#767C8A">CORRECT, UNFORTUNATELY</text>

  <!-- RIGHT: payjoin -->
  <path class="wire-b" d="M576,134 C637,134 637,152 698,152"/>
  <path class="wire-b" d="M576,202 C637,202 637,168 698,168"/>
  <path class="wire" d="M576,134 C637,134 637,232 698,232"/>
  <rect class="box" x="436" y="118" width="140" height="32" rx="6"/>
  <text class="mono amt" x="506" y="139" text-anchor="middle">1.00 &#183; ALICE</text>
  <rect class="box-b" x="436" y="186" width="140" height="32" rx="6"/>
  <text class="mono amt-lit" x="506" y="207" text-anchor="middle">0.50 &#183; BOB</text>
  <text class="mono cap" x="436" y="248" fill="#F59E0B">THE RECEIVER ADDS AN INPUT</text>

  <rect class="box-b" x="698" y="142" width="60" height="36" rx="6"/>
  <text class="mono amt-lit" x="728" y="165" text-anchor="middle">1.20</text>
  <text class="mono cap" x="728" y="128" text-anchor="middle" fill="#767C8A">TO BOB</text>
  <rect class="box" x="698" y="216" width="60" height="32" rx="6"/>
  <text class="mono amt" x="728" y="237" text-anchor="middle">0.30</text>
  <text class="mono cap" x="728" y="268" text-anchor="middle" fill="#767C8A">CHANGE</text>

  <text class="mono cap" x="420" y="318" fill="#F59E0B">ANALYST: PAYMENT LOOKS LIKE 1.20</text>
  <text class="mono cap" x="420" y="348" fill="#F59E0B">WRONG ON AMOUNT, WRONG ON OWNERSHIP</text>

  <text class="mono note" x="40" y="404">RIGHT SIDE: 1.00 + 0.50 IN = 1.20 + 0.30 OUT &#183; BOB GETS THE 0.50 BACK PLUS THE 0.70 PAYMENT</text>
  <text class="mono note" x="40" y="424">FEES OMITTED &#183; THE TRANSACTION LOOKS ORDINARY, WHICH IS THE POINT</text>
</svg>
