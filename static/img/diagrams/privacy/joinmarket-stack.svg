<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="The JoinMarket stack: Jam in your browser drives the JoinMarket NG daemon, which signs coinjoins and talks to makers over Tor, while your own Bitcoin Core node verifies the chain and your balance.">
  <style>
    .mono { font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2.4px; fill: #767C8A; }
    .name    { font-size: 13px; font-weight: 700; fill: #A8AEBB; }
    .name-l  { font-size: 13px; font-weight: 700; fill: #FCD34D; }
    .role    { font-size: 9px; font-weight: 700; letter-spacing: 1.2px; fill: #767C8A; }
    .note    { font-size: 11px; letter-spacing: 1.4px; fill: #767C8A; }
    .wire    { fill: none; stroke: #262E3A; stroke-width: 2; }
    .tor     { fill: none; stroke: #F59E0B; stroke-width: 2; stroke-dasharray: 6 5; }
    .box     { fill: #0C0E12; stroke: #2E3643; stroke-width: 2; }
    .box-lit { fill: #0C0E12; stroke: #F59E0B; stroke-width: 3; }
    .cloud   { fill: none; stroke: #2E3643; stroke-width: 2; stroke-dasharray: 6 5; }
  </style>

  <rect x="0.5" y="0.5" width="799" height="399" rx="14" fill="#0C0E12" stroke="#1C2028"/>
  <text class="mono eyebrow" x="40" y="42">THE JOINMARKET STACK</text>

  <path class="wire" d="M230,140 L300,140"/>
  <path class="wire" d="M300,140 L293,135.9 M300,140 L293,144.1"/>
  <path class="wire" d="M500,140 L570,140"/>
  <path class="wire" d="M570,140 L563,135.9 M570,140 L563,144.1"/>

  <rect class="box" x="60" y="106" width="170" height="68" rx="8"/>
  <text class="mono name" x="145" y="136" text-anchor="middle">JAM</text>
  <text class="mono role" x="145" y="156" text-anchor="middle">YOUR BROWSER &#183; BUTTONS</text>

  <rect class="box-lit" x="300" y="106" width="200" height="68" rx="8"/>
  <text class="mono name-l" x="400" y="136" text-anchor="middle">JOINMARKET NG</text>
  <text class="mono role" x="400" y="156" text-anchor="middle">DAEMON &#183; SIGNS COINJOINS</text>

  <rect class="box" x="570" y="106" width="180" height="68" rx="8"/>
  <text class="mono name" x="660" y="136" text-anchor="middle">BITCOIN CORE</text>
  <text class="mono role" x="660" y="156" text-anchor="middle">YOUR NODE &#183; VERIFIES</text>

  <!-- makers over tor -->
  <path class="tor" d="M400,174 C400,230 400,240 400,252"/>
  <text class="mono role" x="416" y="220" fill="#F59E0B">TOR</text>

  <rect class="cloud" x="280" y="252" width="240" height="70" rx="10"/>
  <text class="mono name" x="400" y="282" text-anchor="middle">MAKERS</text>
  <text class="mono role" x="400" y="302" text-anchor="middle">STRANGERS OFFERING LIQUIDITY</text>

  <text class="mono note" x="40" y="374">EVERYTHING RUNS ON YOUR HARDWARE &#183; COUNTERPARTIES ONLY EVER SEE TOR</text>
</svg>
